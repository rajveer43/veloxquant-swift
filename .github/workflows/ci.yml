name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call: {}

jobs:
  swift-test-macos:
    name: Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  swift-test-linux:
    name: Test (Linux, VeloxQuantCore only)
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      # Package.swift excludes VeloxQuantRuntime and VeloxQuantRuntimeTests from the manifest
      # entirely on non-macOS hosts, so a plain `swift build`/`swift test` here only ever sees
      # VeloxQuantCore — `--filter` alone is not enough, since `swift test` builds every
      # declared target before running the requested subset.
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    # norio-nomura/action-swiftlint (the commonly-suggested action) wraps an unmaintained,
    # multi-years-stale prebuilt SwiftLint image and produced a false-positive force_unwrapping
    # violation with no file/line info that the real, current SwiftLint (0.65.1, verified both
    # locally and via ghcr.io/realm/swiftlint:latest) does not flag — pinning the official image
    # directly instead, matching the exact version used for local verification.
    container:
      image: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint lint --strict
