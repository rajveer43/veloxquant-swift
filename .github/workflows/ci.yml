name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  swift-test-macos:
    name: Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  swift-test-linux:
    name: Test (Linux, VeloxQuantCore only)
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      # Package.swift excludes VeloxQuantRuntime and VeloxQuantRuntimeTests from the manifest
      # entirely on non-macOS hosts, so a plain `swift build`/`swift test` here only ever sees
      # VeloxQuantCore — `--filter` alone is not enough, since `swift test` builds every
      # declared target before running the requested subset.
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict
